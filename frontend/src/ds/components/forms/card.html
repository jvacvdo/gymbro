<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-primary); padding: 18px 20px; overflow: hidden; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .section-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .hr { height: 1px; background: var(--border-subtle); margin: 14px 0; }
    .sizes-row { display: flex; gap: 10px; align-items: flex-start; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Input } = window.GymBroDesignSystem_6cd11e;
    const [val, setVal] = React.useState('');

    function Demo() {
      const [weight, setWeight] = React.useState('100');
      const [reps, setReps] = React.useState('');

      return (
        <div>
          <div className="grid">
            <div>
              <div className="section-label">Default (click to focus)</div>
              <Input label="Exercise" placeholder="Bench Press" />
            </div>
            <div>
              <div className="section-label">With prefix/suffix</div>
              <Input label="Weight" value={weight} onChange={e => setWeight(e.target.value)} type="number" suffix="KG" />
            </div>
            <div>
              <div className="section-label">Error state</div>
              <Input label="Reps" value={reps} onChange={e => setReps(e.target.value)} error="Must be at least 1 rep." />
            </div>
            <div>
              <div className="section-label">With hint</div>
              <Input label="Rest" placeholder="90" suffix="SEC" hint="Recommended 90–120s." />
            </div>
          </div>
          <div className="hr"></div>
          <div className="section-label">Sizes — sm · md · lg</div>
          <div className="sizes-row">
            <div style={{flex:1}}><Input size="sm" label="Small" placeholder="compact" /></div>
            <div style={{flex:1}}><Input size="md" label="Medium" placeholder="default" /></div>
            <div style={{flex:1}}><Input size="lg" label="Large" placeholder="comfortable" /></div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
